# Checks every push and pull request; deploys web/ to GitHub Pages from master.
# Repository settings: Pages -> Source must be "GitHub Actions".
name: Site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Publishing from the app commits only web/trip.enc. Nothing in it can break the code checks below (installing
  # Python and Node and running every check took minutes), so a push that changes nothing else goes straight to deploy.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          code=true
          if [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            if [ "$changed" = "web/trip.enc" ]; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/pyproject.toml
      - run: pip install -e "tools[dev]"
      - name: Python lint and format
        run: ruff check tools && ruff format --check tools
      - name: Example trip data is valid
        run: trip check --data example
      - name: Generated files are up to date
        run: trip schema --check && trip precache --check

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format, lint and type check
        run: npm run check
      - name: Types match the schema
        run: npm run types && git diff --exit-code types/trip.d.ts

  deploy:
    # runs when the checks passed, or were skipped because only the trip changed (but not when they failed)
    if: ${{ !cancelled() && !failure() && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
    needs: [changes, check]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
