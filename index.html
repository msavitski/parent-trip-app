<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Istanbul Family Trip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1546C4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Atkinson Hyperlegible has no Cyrillic, so Cyrillic languages switch to Golos Text and Roboto Mono (see :lang below).
     The browser downloads only the faces a page actually uses. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;700;800&family=Golos+Text:wght@400;700;800&family=Roboto+Mono:wght@500;700&display=swap">
<style>
:root{
  /* Layout: one phone column. Airport-sign yellow marks what happens next and anything you show to a stranger.
     Fixed tab bar at the bottom; full-screen sheets for the taxi card, tickets, money and phrases. */
  --bg:#EDF1F7; --surface:#FFFFFF; --ink:#0D1829; --muted:#45526A; --line:#C9D2E0;
  --accent:#1546C4; --accent-ink:#FFFFFF; --accent-soft:#DDE6FA;
  --danger:#B42318; --danger-ink:#FFFFFF;
  --ok:#17803D; --ok-ink:#FFFFFF;
  /* the same in both themes on purpose: signs stay yellow, tickets stay white for scanners */
  --sign:#FFCE1B; --sign-ink:#111111;
  --paper:#FFFFFF; --paper-ink:#000000; --paper-muted:#4A4A4A;
  --f-text:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",Roboto,system-ui,"Segoe UI",sans-serif;
  --f-mono:"Atkinson Hyperlegible Mono",ui-monospace,"Roboto Mono",Consolas,monospace;
  --radius:16px; --tabbar:4.5rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A111D; --surface:#131D2E; --ink:#EEF2F8; --muted:#A9B5C8; --line:#2A3950;
  --accent:#8FB0FF; --accent-ink:#0A111D; --accent-soft:#1A2948;
  --danger:#D92D2D; --danger-ink:#FFFFFF; --ok:#3FB56E; --ok-ink:#0A111D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A111D; --surface:#131D2E; --ink:#EEF2F8; --muted:#A9B5C8; --line:#2A3950;
  --accent:#8FB0FF; --accent-ink:#0A111D; --accent-soft:#1A2948;
  --danger:#D92D2D; --danger-ink:#FFFFFF; --ok:#3FB56E; --ok-ink:#0A111D; color-scheme:dark}
:root:lang(ru),:root:lang(be),:root:lang(uk),:root:lang(bg),:root:lang(sr),:root:lang(kk){
  --f-text:"Golos Text",Roboto,system-ui,"Segoe UI",sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,Consolas,monospace}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.locked{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.1875rem/1.45 var(--f-text);-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.ic{width:1.5rem;height:1.5rem;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:1rem}
.label{font-size:.875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.wrap{max-width:40rem;margin-inline:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px calc(var(--tabbar) + 32px + env(safe-area-inset-bottom,0px))}
#view{display:flex;flex-direction:column;gap:20px}
.section{display:grid;gap:12px}
.section>h2,.list-head h2{font-size:1.375rem;font-weight:800;line-height:1.2;text-wrap:balance}
.stack{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}

/* header */
.hello{display:grid;gap:4px}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:700;font-size:.9375rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.demo{border:2px dashed currentColor;border-radius:999px;padding:0 10px;font-size:.8125rem;letter-spacing:.06em}
.big{font-weight:800;font-size:2.25rem;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.date{font-size:1.1875rem;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:3rem;padding:6px 18px 6px 10px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700}

/* buttons */
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:3rem;padding:6px 18px 6px 14px;border-radius:999px;
  border:2px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:1.0625rem;line-height:1.2;text-decoration:none}
.btn .ic{width:1.375rem;height:1.375rem}
.btn--solid{background:var(--accent);color:var(--accent-ink)}
.btn--quiet{border-color:var(--line);color:var(--muted);justify-self:start}
.btn--warn{border-color:var(--danger);color:var(--danger)}
.btn:active,.tile:active,.day:active,.tk:active,.chip:active{transform:scale(.98)}

/* next-up sign */
.sign{display:grid;gap:12px;padding:16px 18px 18px;border-radius:var(--radius);background:var(--sign);color:var(--sign-ink)}
.sign-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-weight:700;font-size:1.125rem}
.sign-tag{background:var(--sign-ink);color:var(--sign);padding:3px 10px 2px;border-radius:6px;font-weight:800;font-size:.9375rem;letter-spacing:.1em;text-transform:uppercase}
.sign-main{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:14px;row-gap:4px}
.sign-time{font:700 2.75rem/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sign-title{font-weight:800;font-size:1.625rem;line-height:1.15;text-wrap:balance;min-width:0}
.sign .btn{border-color:var(--sign-ink);color:var(--sign-ink)}
.sign--rest{display:flex;align-items:center;gap:14px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.sign--rest .ic{width:2rem;height:2rem;color:var(--accent)}

/* quick tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:34rem){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;min-height:7rem;padding:14px 16px 16px;
  border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;text-decoration:none;
  font-weight:800;font-size:1.1875rem;line-height:1.2}
.tile .ic{width:2rem;height:2rem;color:var(--accent)}
.tile small{display:block;margin-top:4px;font-weight:400;font-size:.9375rem;line-height:1.3;color:var(--muted)}
.tile--sos{background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.tile--sos .ic,.tile--sos small{color:var(--danger-ink)}

.note{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:var(--radius);background:var(--accent-soft)}
.note .ic{margin-top:2px;color:var(--accent)}

/* login */
.login{display:grid;gap:14px;width:100%;max-width:26rem;margin-inline:auto;padding-top:4vh}
.login-badge{display:grid;place-items:center;width:4.5rem;height:4.5rem;border-radius:50%;background:var(--sign);color:var(--sign-ink)}
.login-badge .ic{width:2.25rem;height:2.25rem}
.pw{display:flex;align-items:center;border:3px solid var(--accent);border-radius:var(--radius);background:var(--surface)}
.pw:focus-within{box-shadow:0 0 0 4px var(--accent-soft)}
.pw input{flex:1;min-width:0;padding:12px 16px;border:0;outline:none;background:transparent;color:var(--ink);font:700 1.5rem/1.2 var(--f-mono);letter-spacing:.04em}
.pw-eye{flex:none;display:grid;place-items:center;width:3.5rem;height:3.5rem;border:0;background:transparent;color:var(--muted)}
.pw-eye .ic{width:1.75rem;height:1.75rem}
.login-err{padding:10px 14px;border-radius:12px;background:var(--danger);color:var(--danger-ink);font-weight:700}
.btn--big{width:100%;min-height:3.75rem;font-size:1.25rem}
.btn:disabled{opacity:.6;cursor:progress}

/* weather: four numbers side by side, then what to wear */
.wx{display:grid;gap:14px}
.wx-head{display:flex;align-items:center;gap:12px;font-size:1.1875rem;line-height:1.3}
.wx-head b{font-weight:800}
.wx-ic{width:2.5rem;height:2.5rem;color:var(--accent)}
.wx-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
.wx-cell{display:grid;justify-items:center;align-content:start;gap:4px;padding:10px 2px 8px;border-radius:12px;background:var(--accent-soft);text-align:center}
.wx-cell dt{order:2;font-size:.8125rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.wx-cell dd{margin:0;display:grid;justify-items:center;gap:4px}
.wx-cell dd .ic{width:1.25rem;height:1.25rem;color:var(--accent)}
.wx-cell b{font:700 1.375rem/1.1 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.wx-cell b small{margin-left:2px;font:700 .75rem var(--f-text);color:var(--muted)}
.wear{display:grid;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.wear-main{display:flex;align-items:flex-start;gap:10px;font-size:1.1875rem;font-weight:800;line-height:1.3}
.wear-main .ic{margin-top:1px;color:var(--accent)}
.wear-list{margin:0;padding-left:3.25rem;display:grid;gap:4px}
.wx-upd{font-size:.9375rem;color:var(--muted)}
.wx--empty{display:flex;align-items:center;gap:12px;color:var(--muted)}
.wx--empty .ic{width:2rem;height:2rem}
.wx-mini{display:inline-flex;align-items:center;gap:6px;margin-top:2px;font:700 1rem var(--f-mono);color:var(--muted)}
.wx-mini .ic{width:1.25rem;height:1.25rem}

/* day timeline */
.timeline{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:4rem 1.5rem minmax(0,1fr);column-gap:10px}
.ev-time{font:700 1.1875rem/1.6 var(--f-mono);font-variant-numeric:tabular-nums}
.ev-rail{position:relative}
.ev-rail::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--line)}
.ev:first-child .ev-rail::before{top:14px}
.ev:last-child .ev-rail::before{bottom:auto;height:14px}
.ev:only-child .ev-rail::before{display:none}
.ev-rail::after{content:"";position:absolute;left:50%;top:7px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.ev--past .ev-rail::after{background:var(--line);border-color:var(--line)}
.ev--now .ev-rail::after{background:var(--accent)}
.ev--next .ev-rail::after{top:4px;width:24px;height:24px;margin-left:-12px;background:var(--sign);border-color:var(--sign-ink)}
.ev-body{display:grid;gap:6px;min-width:0;padding-bottom:24px}
.ev-title{display:flex;align-items:flex-start;gap:8px;font-size:1.25rem;font-weight:800;line-height:1.3}
.ev-title .ic{margin-top:2px;color:var(--accent)}
.ev--past .ev-time,.ev--past .ev-body,.ev--past .ev-title .ic{color:var(--muted)}
.ev .actions{margin-top:4px}
.tag{justify-self:start;display:inline-block;padding:2px 10px;border-radius:6px;font-weight:800;font-size:.8125rem;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.tag--next,.tag--today{background:var(--sign);color:var(--sign-ink)}
.tag--now{background:var(--accent);color:var(--accent-ink)}
.tag--done{color:var(--muted);border:2px solid var(--line);padding:0 8px}

/* days list */
.days{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.day{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:12px 12px 12px 12px;
  border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);text-align:left}
.day--today{border:2px solid var(--accent)}
.leaf{display:grid;justify-items:center;width:3.75rem;padding:6px 0;border-radius:10px;background:var(--accent-soft);line-height:1.1}
.leaf small{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.leaf b{font:700 1.75rem/1.1 var(--f-mono)}
.day--today .leaf{background:var(--sign);color:var(--sign-ink)}
.day--today .leaf small{color:var(--sign-ink)}
.day-main{display:grid;gap:2px;min-width:0}
.day-n{font-size:.875rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day-t{font-size:1.25rem;font-weight:800;line-height:1.2}
.chev{color:var(--muted)}

/* checklists */
.list{display:grid;gap:8px}
.list-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.count{font:700 1rem var(--f-mono);color:var(--muted);white-space:nowrap}
.checks{list-style:none;margin:0;padding:0}
.checks li+li{border-top:1px solid var(--line)}
.check{display:flex;align-items:center;gap:14px;min-height:3.5rem;padding:8px 0;cursor:pointer}
.check input{appearance:none;-webkit-appearance:none;margin:0;flex:none;display:grid;place-content:center;width:2rem;height:2rem;
  border:3px solid var(--muted);border-radius:8px;background:var(--surface);cursor:pointer}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{content:"";width:.55rem;height:1rem;border:solid var(--ok-ink);border-width:0 4px 4px 0;transform:translateY(-2px) rotate(45deg)}
.check input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}

/* phrases */
.phrase{display:grid;gap:6px}
.ph-mean{font-size:1.0625rem;font-weight:700;color:var(--muted)}
.ph-local{font-size:1.625rem;font-weight:800;line-height:1.2}
.ph-say{font:500 1rem var(--f-mono);color:var(--muted)}
.phrase .actions{margin-top:6px}

/* help */
.sos{display:grid;gap:6px;background:var(--danger);border-color:var(--danger);color:var(--danger-ink)}
.sos-label{font-size:.9375rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.sos-num{display:inline-flex;align-items:center;gap:12px;justify-self:start;font:700 3.5rem/1 var(--f-mono);color:var(--danger-ink);text-decoration:none}
.sos-num .ic{width:2.5rem;height:2.5rem}
.person{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.person-main{display:grid;gap:2px;min-width:0}
.person-name,.info-name{font-size:1.3125rem;font-weight:800}
.info{display:grid;gap:6px}
.info .actions{margin-top:6px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:2.25rem minmax(0,1fr);gap:12px;align-items:start}
.steps li::before{content:counter(s);display:grid;place-items:center;width:2.25rem;height:2.25rem;border-radius:50%;background:var(--ink);color:var(--bg);font:700 1.125rem var(--f-mono)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,minmax(0,7.5rem));justify-content:center;
  background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:var(--tabbar);padding:6px 2px;
  border:0;background:transparent;color:var(--muted);font-weight:700;font-size:.875rem;line-height:1.1}
.tab .ic{width:1.75rem;height:1.75rem}
.tab[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.tab--help .ic{color:var(--danger)}

/* full-screen sheets */
.sheet{position:fixed;inset:0;z-index:20;overflow-y:auto;overscroll-behavior:contain;display:grid;align-content:start;gap:18px;
  background:var(--bg);color:var(--ink);
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet>*{width:100%;max-width:40rem;margin-inline:auto}
@media (prefers-reduced-motion:no-preference){.sheet:not([hidden]){animation:rise .18s ease-out}}
@keyframes rise{from{transform:translateY(14px)}}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-title{min-width:0;font-size:1.5rem;font-weight:800;line-height:1.2}
.close{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:3.25rem;padding:6px 18px 6px 12px;border-radius:999px;border:2px solid currentColor;background:transparent;font-weight:800}
.sub{font-size:1.125rem;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:2.75rem;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:1rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.sheet--taxi{background:var(--sign);color:var(--sign-ink)}
.sheet--taxi .btn,.sheet--taxi .chip{background:transparent;border-color:var(--sign-ink);color:var(--sign-ink)}
.taxi-hint{font-size:1.125rem;font-weight:700}
.taxi-card{display:grid;gap:14px;padding-block:20px;border-block:3px solid var(--sign-ink)}
.taxi-ask{font-size:1.5rem;font-weight:700;line-height:1.25}
.taxi-name{font-size:2.5rem;font-weight:800;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.taxi-addr{font-size:1.75rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere}

.tk-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.tk{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:16px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface);text-align:left}
.tk>.ic:first-child{width:2rem;height:2rem;color:var(--accent)}
.tk-main{display:grid;gap:2px}
.tk-main b{font-size:1.25rem}
.tk-main span{font-size:1rem;color:var(--muted)}

.sheet--ticket,.sheet--phrase{background:var(--paper);color:var(--paper-ink)}
.sheet--ticket .label,.sheet--phrase .label{color:var(--paper-muted)}
.sheet--phrase .btn{border-color:var(--paper-ink);color:var(--paper-ink)}
.sheet--phrase .btn--solid{background:var(--paper-ink);color:var(--paper)}
.ticket{display:grid;justify-items:center;gap:10px;text-align:center}
.ticket-img{display:block;width:100%;max-width:22rem;aspect-ratio:1;image-rendering:pixelated;background:var(--paper)}
.ticket-when{font-size:1.125rem;font-weight:700}
.ticket-code{font:700 2.25rem/1.1 var(--f-mono);letter-spacing:.12em;overflow-wrap:anywhere}
.ticket-details{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:6px;font-size:1.25rem;font-weight:700}
.ticket-hint{display:flex;align-items:flex-start;gap:10px;margin-top:8px;text-align:left;font-size:1rem;color:var(--paper-muted)}

.money{display:grid;gap:14px}
.money-in{display:flex;align-items:center;gap:10px;padding:8px 16px;border:3px solid var(--accent);border-radius:var(--radius);background:var(--surface)}
.money-in:focus-within{box-shadow:0 0 0 4px var(--accent-soft)}
.cur{font:700 2.25rem var(--f-mono);color:var(--muted)}
.money-in input{flex:1;min-width:0;padding:4px 0;border:0;outline:none;background:transparent;color:var(--ink);font:700 2.5rem/1.2 var(--f-mono)}
.money-out{font:700 2.75rem/1.1 var(--f-mono);overflow-wrap:anywhere}
.money .btn{justify-self:start}

.show{display:grid;gap:14px;padding-top:8px}
.show-local{font-size:2.75rem;font-weight:800;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.show-extra{font:700 2rem/1.2 var(--f-mono);overflow-wrap:anywhere}
.show-say{font:500 1.25rem var(--f-mono);color:var(--paper-muted)}
.show-mean{font-size:1.25rem;color:var(--paper-muted)}
.show .btn{justify-self:start}
</style>
</head>
<body>
<div class="wrap"><main id="view"></main></div>
