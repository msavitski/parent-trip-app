<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Our Trip</title>
    <meta name="theme-color" content="#1546C4" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Atkinson Hyperlegible has no Cyrillic, so Cyrillic languages switch to Golos Text and Roboto Mono
         (see css/tokens.css). The browser downloads only the faces a page actually uses. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;700;800&family=Golos+Text:wght@400;700;800&family=Roboto+Mono:wght@500;700&display=swap"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="wrap"><main id="view"></main></div>
    <nav class="tabs" id="tabs" aria-label="Sections" hidden></nav>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>

    <script>
      // If the app's modules don't load (a broken download, a very old browser), show a reload button
      // instead of an empty page. Icons only: the translations may not have loaded either.
      setTimeout(function () {
        var view = document.getElementById('view');
        if (document.documentElement.dataset.ready || !view || view.childElementCount) return;
        view.innerHTML =
          '<div class="login"><span class="login-badge"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' +
          '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>' +
          '</svg></span><button class="btn btn--solid btn--big" type="button" aria-label="↻" onclick="location.reload()">' +
          '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>' +
          '</button></div>';
      }, 10000);
    </script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
